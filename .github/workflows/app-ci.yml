name: app

# Only application changes. The gitops/ tree has its own workflow, and keeping the
# triggers disjoint is one of the guards that stops the image-tag bump at the end of
# this workflow from retriggering it.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements-dev.txt
            chaos/harness/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt -r chaos/harness/requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # Covers the services, the shared library and the chaos harness. The harness
        # tests include cross-checks that every alert name and sloth_id referenced in
        # chaos/scenarios.yaml actually exists in the generated Sloth rules - a rename
        # on one side would otherwise only surface as a chaos run that waits ten
        # minutes for an alert that can never fire.
        run: python -m pytest

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [storefront, catalog, recs]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          # Pull requests build but do not push. A PR from a fork has no package write
          # permission, and publishing an image for code that has not merged would put
          # unreviewed tags in the registry.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  bump-gitops:
    # The GitOps half of continuous delivery: CI does not deploy, it writes the desired
    # state to Git and lets Argo CD converge the cluster. Nothing in this pipeline has
    # cluster credentials.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Pin the new image tags in the EKS overlays
        working-directory: gitops/services
        run: |
          for svc in storefront catalog recs; do
            (cd "$svc/overlays/eks" && kustomize edit set image \
              "ghcr.io/${{ github.repository }}/$svc=ghcr.io/${{ github.repository }}/$svc:sha-${{ github.sha }}")
          done

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "image tags unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/services
          # [skip ci] plus the disjoint path filters plus the fact that pushes made with
          # GITHUB_TOKEN do not trigger workflows: three independent guards against a
          # commit loop, because one of them silently stopping working would cost real
          # Actions minutes before anyone noticed.
          git commit -m "Pin ${{ github.sha }} images in the EKS overlays [skip ci]"
          git push
