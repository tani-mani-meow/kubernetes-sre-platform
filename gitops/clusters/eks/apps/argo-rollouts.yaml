# Cluster: eks
# Argo Rollouts controller + dashboard.
#
# Wave 0 alongside kube-prometheus-stack — both install CRDs and neither depends
# on the other, so they can converge in parallel. storefront (wave 7) is a
# Rollout, and a Rollout manifest applied before its CRD exists fails the whole
# sync, not just that resource.
#
# The controller's AnalysisTemplates query Prometheus, but that is a runtime
# dependency resolved at canary time, not a sync-order one — Rollouts starts
# fine without Prometheus and only an actual canary needs it up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: /gitops/platform/argo-rollouts
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.42.0
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/gitops/platform/argo-rollouts/values-eks.yaml
    - repoURL: https://github.com/tani-mani-meow/k8s-slo-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      # The Rollout CRD carries a full PodTemplateSpec schema inline — same
      # annotation-size problem as the Prometheus Operator CRDs.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
