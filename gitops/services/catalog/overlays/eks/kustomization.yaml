apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base

images:
  # Rewritten in place by the release workflow; see the storefront eks overlay for why the
  # placeholder is deliberately unresolvable.
  - name: ghcr.io/tani-mani-meow/k8s-slo-platform/catalog
    newTag: sha-placeholder

patches:
  - target:
      kind: Deployment
      name: catalog
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog
      spec:
        template:
          spec:
            containers:
              - name: catalog
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 512Mi
