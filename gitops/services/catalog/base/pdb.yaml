apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: k8s-slo-platform
    app.kubernetes.io/component: api
spec:
  # maxUnavailable, not minAvailable: it stays correct if replicas grow, and it does not
  # deadlock `kubectl drain` in the CI overlay where there is only one replica.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
