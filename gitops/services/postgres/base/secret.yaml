# Demo credentials, committed on purpose. The database holds twelve rows of invented desk
# accessories and dies with the cluster. A real deployment would pull these from External
# Secrets (Secrets Manager via IRSA on EKS) - rejected here in planning.md as a subsystem
# that produces no additional SLO evidence.
#
# These three values and the DSN in gitops/services/catalog/base/kustomization.yaml are
# the same credential written twice: catalog and postgres are separate Argo CD
# Applications and neither can reference the other's objects without absorbing it. Change
# them together. The symptom of getting it wrong is catalog stuck NotReady with a
# password-authentication failure in its logs.
#
# A plain Secret, not a secretGenerator, unlike catalog's DSN. The generator's name hash
# is useful there because a changed DSN *must* reach running pods. Here it would be
# actively misleading: POSTGRES_PASSWORD is only read by initdb on first boot, so a hash
# change would roll the StatefulSet and the database's actual password would stay exactly
# as it was. Rotating this requires an ALTER ROLE or a fresh volume, and a fixed name
# keeps that honest.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-slo-platform
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # The application owns its own database and role: catalog connects as the owner, so the
  # seed Job can CREATE TABLE without a separate superuser step.
  POSTGRES_USER: catalog
  POSTGRES_PASSWORD: demo-not-a-secret
  POSTGRES_DB: catalog
