apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hand-written rules, kept separate from ../generated so the boundary is obvious: that
# directory is Sloth output and is overwritten by `make slo-gen`; anything edited here
# survives.
namespace: monitoring

resources:
  - symptom-rules.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: k8s-slo-platform
      app.kubernetes.io/component: slo
