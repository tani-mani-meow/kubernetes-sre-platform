# Packaging metadata for the shared library only. Lint and test configuration lives in
# the repo-root pyproject.toml so the services and the chaos harness share one setup.

[project]
name = "svc-common"
version = "0.1.0"
description = "Shared platform wiring for the k8s-slo-platform demo services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.32,<0.53",
    "httpx>=0.27,<0.29",
    "prometheus-client>=0.21,<0.27",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["libs"]
include = ["svc_common*"]
